stages:
  - 1_linter
  - 2_build_and_install
  - 3_mvn_install
  - 4_sonarqube

# The runner has no distributed cache, so every cache entry is a zip written to and read from the
# runner's own disk. .webpack_cache is around 450MB of mostly incompressible pack files, and at the
# default level the runner spends longer deflating it than it saves.
variables:
  CACHE_COMPRESSION_LEVEL: "fastest"

# Two entries rather than one, because the two directories change on entirely different clocks.
# .npm is settled by the lockfile and only turns over when a dependency does; .webpack_cache is
# rewritten by every build. Held together under one key, a build rezipped the npm cache along with
# its own, and a job that ran neither npm nor webpack rezipped both.
.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - .npm/

# Written by one job and read by the rest. Every job that pushes it pays to rezip all 450MB on the
# way out, and only the first build of a pipeline has anything new to contribute.
.webpack_cache: &webpack_cache
  key: "webpack-$CI_COMMIT_REF_SLUG"
  paths:
    - .webpack_cache/

before_script:
  - pwd
  - echo $CI_COMMIT_REF_NAME
  - git remote -v
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_COMMIT_REF_NAME

after_script:
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_COMMIT_REF_NAME

1_npm_install_test_build:
  cache:
    - *npm_cache
    - *webpack_cache
  stage: 1_linter
  script:
    - pwd
    - git reset --hard HEAD
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund
    - npm run test
    - npm run build

1_build_test_java:
  cache: []
  stage: 2_build_and_install
  script:
    - mvn clean
    - mvn test
    
1_perun-core-dev-install:
  cache:
    - <<: *npm_cache
      policy: pull
    - <<: *webpack_cache
      policy: pull
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund
    - rm -rf www/*.js
    - npm run build-dev
    - pwd
    - mvn clean deploy -DskipTests
  only:
    - dev

1_perun-core-dev-generate-js:
  cache:
    - <<: *npm_cache
      policy: pull
    - <<: *webpack_cache
      policy: pull
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund
    - rm -rf www/*.js
    - npm run build-dev
    - url_host=`git remote get-url origin | sed -e "s/https:\/\/gitlab-ci-token:.*@//g"`
    - git remote set-url origin "https://gitlab-ci-token:${K8S_SECRET_GITLABCI_TOKEN}@${url_host}"
    - git remote -v
    - git add www/*.js
    - git commit -m "Auto commit of perun-core library for npm" || exit 0
    - git push origin HEAD:$CI_COMMIT_REF_NAME    
  only:
    - dev
  when: manual

2_perun-core-stable-generate-js:
  cache:
    - <<: *npm_cache
      policy: pull
    - <<: *webpack_cache
      policy: pull
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund
    - rm -rf www/*.js
    - npm run build
    - url_host=`git remote get-url origin | sed -e "s/https:\/\/gitlab-ci-token:.*@//g"`
    - git remote set-url origin "https://gitlab-ci-token:${K8S_SECRET_GITLABCI_TOKEN}@${url_host}"
    - git remote -v
    - git add www/*.js
    - git commit -m "Auto commit of perun-core library for npm" || exit 0
    - git push origin HEAD:$CI_COMMIT_REF_NAME    
  only:
    - main
  when: manual

2_perun-core-stable-install:
  cache:
    - <<: *npm_cache
      policy: pull
    - <<: *webpack_cache
      policy: pull
  stage: 3_mvn_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund
    - rm -rf www/*.js
    - npm run build
    - pwd
    - mvn clean deploy -DskipTests
  only:
    - main

1_perun-sonarqube_backend:
  cache: []
  stage: 4_sonarqube
  script:
    - cd $CI_PROJECT_DIR/
    - mvn sonar:sonar -Dsonar.analysis.mode=preview -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHA -Dsonar.gitlab.ref_name=$CI_COMMIT_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
  when: manual

2_perun-sonarqube_backend_publish:
  cache: []
  stage: 4_sonarqube
  script:
    - cd $CI_PROJECT_DIR/
    - mvn sonar:sonar -Dsonar.analysis.mode=publish -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_COMMIT_SHA -Dsonar.gitlab.ref_name=$CI_COMMIT_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID -Donar.gitlab.user_token access=a18878c7b5beb401ce2f847537c296b46a3902b8 
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - dev  
  when: manual

3_sonarqube_frontend:
  cache: []
  stage: 4_sonarqube
  script:
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=preview -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=publish -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME
  when: manual
